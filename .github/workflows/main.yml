name: Main workflow

on:
  push:
    branches:
      - "staging"
  pull_request:
    branches:
      - "**"

jobs:
  app-lint:
    name: Lint (app)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Run lint check
        run: npm --prefix ./app run lint

  app-format-check:
    name: Check formatting (app)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Run format check
        run: cd app && npm exec prettier -- --check .

  app-test:
    name: Run tests (app)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Run tests
        run: npm --prefix ./app test

  api-lint:
    name: Lint (api)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Install dependencies
        run: poetry --directory ./api install --all-groups
      - name: Run lint check
        run: poetry --directory ./api run ruff check app tests

  api-format-check:
    name: Check formatting (api)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Install dependencies
        run: poetry --directory ./api install --all-groups
      - name: Run format check
        run: poetry --directory ./api run ruff format --check app tests

  api-typecheck:
    name: Type check (api)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Install dependencies
        run: poetry --directory ./api install --all-groups
      - name: Run type check
        run: poetry --directory ./api run pyright

  api-test:
    name: Run tests (api)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: service_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Install dependencies
        run: poetry --directory ./api install --all-groups
      - name: Run tests
        run: poetry --directory ./api run pytest
        env:
          ENV: test
          POSTGRES_PASSWORD: postgres
