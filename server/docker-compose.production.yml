name: service-assistant-production

services:

  app:
    build: .
    env_file: .env
    command: >
      sh -c "alembic upgrade head && fastapi run --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - attachments:/attachments
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  attachments:
