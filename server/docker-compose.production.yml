services:
  app:
    build: .
    env_file: .env
    command: >
      sh -c "alembic upgrade head && fastapi run --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "127.0.0.1:${PORT}:8000"
    volumes:
      - attachments:/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:${DOCKER_GATEWAY}"

  client:
    build:
      context: ../client
      args:
        # TODO: VERY IMPORTANT: FIX THIS BECAUSE NOW EVERYONE CAN HAVE ACCESS TO THESE SECRETS BY JUST READING CLIENT SIDE CODE
        EXPO_PUBLIC_AUTH_URL: ${BACKEND_URL}
        EXPO_PUBLIC_AUTH_TOKEN: ${AUTH_TOKEN}
        EXPO_PUBLIC_DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
    ports:
      - "127.0.0.1:${CLIENT_APP_PORT}:80"
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      args:
        VITE_BACKEND_URL: ${BACKEND_URL}
    ports:
      - "127.0.0.1:${ADMIN_APP_PORT}:80"
    restart: unless-stopped

volumes:
  attachments:

networks:
  default:
    driver: bridge
    ipam:
      config:
      # Constant subnet to let Postgres know what ąddress to listen on
        - subnet: ${DOCKER_SUBNET}
