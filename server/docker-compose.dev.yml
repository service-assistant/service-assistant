name: service-assistant-dev

services:
  app:
    build: .
    env_file: .env
    environment:
      ENV: development
    command: >
      sh -c "alembic upgrade head && fastapi dev --host 0.0.0.0 --port 8000"
    ports:
      - "${PORT}:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - attachments:/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:${DOCKER_GATEWAY}"

  client:
    build:
      context: ../client
      args:
        EXPO_PUBLIC_AUTH_URL: http://localhost:${PORT}
        EXPO_PUBLIC_AUTH_TOKEN: ${AUTH_TOKEN}
        EXPO_PUBLIC_DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
    ports:
      - "127.0.0.1:${CLIENT_APP_PORT}:80"
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      args:
        VITE_BACKEND_URL: http://localhost:${PORT}
    ports:
      - "127.0.0.1:${ADMIN_APP_PORT}:80"
    restart: unless-stopped

volumes:
  attachments:
