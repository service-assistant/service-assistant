{% extends "admin/base.html" %}

{% block title %}Edit Category{% endblock %}
{% block heading %}Edit Category{% endblock %}

{% block content %}
<section class="bg-white border border-gray-200 rounded-lg p-6 max-w-md">
    <form method="post" action="/api/categories/{{ category.id }}"
          data-method="PATCH"
          data-redirect="/admin/categories"
          data-success-msg="Category saved."
          class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input type="text" name="name" required value="{{ category.name }}"
                class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Parent <span class="text-gray-400">(optional)</span></label>
            <select name="parent_id"
                class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">— none (root) —</option>
                {% for other in categories %}
                {% if other.id != category.id %}
                <option value="{{ other.id }}" {% if other.id == category.parent_id %}selected{% endif %}>{{ other.name }}</option>
                {% endif %}
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Image URL <span class="text-gray-400">(optional)</span></label>
            <input type="url" name="image_url" value="{{ category.image_url or '' }}"
                class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="flex items-center gap-3">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-md transition-colors">
                Save
            </button>
            <a href="/admin/categories" class="text-sm text-gray-500 hover:text-gray-700">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
